<text x="32" y="24" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#0f172a">同一台 VM 的两次快照：三种类型各写入哪些页（示意）</text>
<text x="32" y="64" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#334155">场景：t0 从 base 快照恢复 → 周期① 客户机写页2、页4 → 做快照① → 周期② 客户机写页4、页5 → 做快照②。下表比较快照② 写入的页。</text>
