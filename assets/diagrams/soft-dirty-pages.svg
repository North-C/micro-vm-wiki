<text x="784" y="400.0" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#334155">规则：自上次快照写过才写。</text><text x="784" y="420.0" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#334155">快照② 只写页4、页5（窗口按周期清零）</text>
<text x="32" y="496" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#334155">颜色 = 写入历史：绿 = 周期② 写过；橙 = 仅周期① 写过；灰 = 自恢复起未写过。「｜写」= 写入快照② 的镜像，「｜—」= 本次不写。</text>
<text x="32" y="522" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#334155">前提：已成功布防、dirty log 关闭、无 swap 与映射变化、写入可被该跟踪观察到（已换出页会被保守计入，见正文）。</text>
<text x="32" y="548" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#64748b">示意图，非实测数据。SoftDirty 首次执行写完整匿名页集（同 Incremental 行），本图比较第二次起的稳态。</text>
