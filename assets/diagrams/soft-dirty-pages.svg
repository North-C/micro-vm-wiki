<text x="724" y="332" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#334155">页6｜—</text>
<text x="784" y="304.0" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#334155">规则：自上次 restore 写过即写。</text><text x="784" y="324.0" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#334155">快照② 写页2、页4、页5（页2 仍要再写）</text>
<rect x="32" y="400" width="200" height="56" rx="20" fill="#eff6ff" stroke="#475569" stroke-width="1.5"/>
<text x="132" y="428" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#0f172a">SoftDirty</text>
<rect x="248" y="400" width="72" height="56" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
