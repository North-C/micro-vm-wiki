<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="352" viewBox="0 0 1152 352">
<defs>
<marker id="arrow-block" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor" />
</marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.5" />
</marker>
<marker id="arrow-classic" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="currentColor" />
</marker>
<marker id="arrow-diamond" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
  <path d="M 0 6 L 6 0 L 12 6 L 6 12 Z" fill="currentColor" />
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF" />
<text x="32" y="24" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#334155">同一页的六个时点：快照文件与私有 RAM 分开（示意）</text>
<rect x="32" y="112" width="152" height="104" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
<text x="108" y="154.2" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#1e3a8a">模板 S0 内存文件</text>
<text x="108" y="173.8" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#1e3a8a">页4 = 旧</text>
<rect x="216" y="112" width="152" height="104" rx="20" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" />
<text x="292" y="154.2" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#14532d">运行实例 A 读 S0</text>
<text x="292" y="173.8" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#14532d">文件页 = 旧</text>
<rect x="400" y="112" width="152" height="104" rx="20" fill="#fff7ed" stroke="#b45309" stroke-width="1.5" />
<text x="476" y="144.4" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#78350f">A 写页4</text>
<text x="476" y="164" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#78350f">私有 RAM = 甲</text>
<text x="476" y="183.6" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#78350f">S0 仍是旧</text>
<rect x="584" y="112" width="152" height="104" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
<text x="660" y="144.4" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#1e3a8a">A 首次保存 S1</text>
<text x="660" y="164" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#1e3a8a">克隆 S0 + 叠写</text>
<text x="660" y="183.6" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#1e3a8a">S1 页4 = 甲</text>
<rect x="768" y="112" width="152" height="104" rx="20" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" />
<text x="844" y="154.2" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#14532d">新实例 B 读 S1</text>
<text x="844" y="173.8" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#14532d">文件页 = 甲</text>
<rect x="952" y="112" width="152" height="104" rx="20" fill="#fff7ed" stroke="#b45309" stroke-width="1.5" />
<text x="1028" y="144.4" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#78350f">B 写页4</text>
<text x="1028" y="164" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#78350f">私有 RAM = 乙</text>
<text x="1028" y="183.6" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#78350f">S1 仍是甲</text>
<text x="32" y="256" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#334155">箭头表示时间先后；A/B是独立运行实例，S0/S1是快照内存文件。页4及旧/甲/乙均为示意标签。</text>
<text x="32" y="296" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#334155">蓝 = 磁盘文件，绿 = 读取文件页，橙 = 私有 RAM。不同 inode 的磁盘块共享不证明页缓存也共享。</text>
<line x1="184" y1="164" x2="216" y2="164" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow-block)" style="color: #1E293B" fill="none" />
<line x1="368" y1="164" x2="400" y2="164" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow-block)" style="color: #1E293B" fill="none" />
<line x1="552" y1="164" x2="584" y2="164" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow-block)" style="color: #1E293B" fill="none" />
<line x1="736" y1="164" x2="768" y2="164" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow-block)" style="color: #1E293B" fill="none" />
<line x1="920" y1="164" x2="952" y2="164" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow-block)" style="color: #1E293B" fill="none" />
</svg>