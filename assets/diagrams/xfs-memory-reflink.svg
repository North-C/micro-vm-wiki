<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="512" viewBox="0 0 1152 512">
<defs>
<marker id="arrow-block" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor" />
</marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.5" />
</marker>
<marker id="arrow-classic" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="currentColor" />
</marker>
<marker id="arrow-diamond" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
  <path d="M 0 6 L 6 0 L 12 6 L 6 12 Z" fill="currentColor" />
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF" />
<text x="32" y="24" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#334155">内存文件克隆与覆盖：不同 inode 怎样共享和分裂磁盘块（示意）</text>
<text x="208" y="88" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#334155">S0：原文件</text>
<text x="528" y="88" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#334155">S1：目标文件</text>
<text x="848" y="88" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#334155">物理区间</text>
<text x="32" y="168" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#334155">FICLONE 后</text>
<rect x="208" y="136" width="272" height="96" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
<text x="344" y="173.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#1e3a8a">S0 的 inode</text>
<text x="344" y="194.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#1e3a8a">页4区间 → E0</text>
<rect x="528" y="136" width="272" height="96" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
<text x="664" y="173.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#1e3a8a">S1 的 inode</text>
<text x="664" y="194.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#1e3a8a">页4区间 → E0</text>
<rect x="848" y="136" width="272" height="96" rx="20" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" />
<text x="984" y="173.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#14532d">旧物理区间 E0</text>
<text x="984" y="194.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#14532d">S0/S1共享，概念引用数2</text>
<text x="32" y="336" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#334155">覆盖完成后</text>
<rect x="208" y="304" width="272" height="96" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
<text x="344" y="341.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#1e3a8a">S0 的 inode</text>
<text x="344" y="362.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#1e3a8a">页4区间 → E0</text>
<rect x="528" y="304" width="272" height="96" rx="20" fill="#fff7ed" stroke="#b45309" stroke-width="1.5" />
<text x="664" y="341.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#78350f">S1 的 inode</text>
<text x="664" y="362.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#78350f">页4区间 → E1</text>
<rect x="848" y="304" width="272" height="96" rx="20" fill="#fff7ed" stroke="#b45309" stroke-width="1.5" />
<text x="984" y="341.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#78350f">S0 → 旧物理区间 E0</text>
<text x="984" y="362.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#78350f">S1 → 新物理区间 E1</text>
<text x="32" y="432" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#334155">S0/S1=快照内存文件，E0/E1=旧/新磁盘extent；箭头表示块映射，不是执行顺序。</text>
<text x="32" y="472" text-anchor="start" dominant-baseline="hanging" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#334155">第二行表示相应数据写回与映射更新后的状态；不表示修改 RAM 当时就发生文件系统 CoW。</text>
</svg>