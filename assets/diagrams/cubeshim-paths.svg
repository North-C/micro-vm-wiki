<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="592" viewBox="0 0 1152 592">
<defs>
<marker id="arrow-block" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="currentColor"/>
</marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="currentColor" stroke-width="1.5"/>
</marker>
<marker id="arrow-classic" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 L 3 5 Z" fill="currentColor"/>
</marker>
<marker id="arrow-diamond" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
  <path d="M 0 6 L 6 0 L 12 6 L 6 12 Z" fill="currentColor"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="32" y="24" text-anchor="start" dominant-baseline="hanging" font-family="Inter, Roboto, system-ui, -apple-system, sans-serif" font-size="20" fill="#0f172a">① 管理虚拟机｜同一个 CubeShim 进程，不同线程</text>
<rect x="32" y="96" width="224" height="64" rx="20" fill="#eff6ff" stroke="#475569" stroke-width="1.5"/>
<text x="144" y="128" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#0f172a">CubeShim 控制线程</text>
<rect x="400" y="96" width="224" height="64" rx="20" fill="#eff6ff" stroke="#475569" stroke-width="1.5"/>
<text x="512" y="128" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#0f172a">请求队列 + eventfd</text>
<rect x="768" y="96" width="224" height="64" rx="20" fill="#eff6ff" stroke="#475569" stroke-width="1.5"/>
<text x="880" y="128" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#0f172a">VMM 线程</text>
<text x="32" y="200" text-anchor="start" dominant-baseline="hanging" font-family="Inter, Roboto, system-ui, -apple-system, sans-serif" font-size="20" fill="#0f172a">② 发送命令｜从宿主机进入 guest</text>
<rect x="32" y="272" width="224" height="64" rx="20" fill="#eff6ff" stroke="#475569" stroke-width="1.5"/>
<text x="144" y="304" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#0f172a">CubeShim 连接端</text>
<rect x="400" y="272" width="224" height="64" rx="20" fill="#eff6ff" stroke="#475569" stroke-width="1.5"/>
<text x="512" y="304" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#0f172a">cube.sock + virtio-vsock</text>
<rect x="768" y="272" width="224" height="64" rx="20" fill="#eff6ff" stroke="#475569" stroke-width="1.5"/>
<text x="880" y="304" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#0f172a">guest 内的 agent</text>
<text x="32" y="376" text-anchor="start" dominant-baseline="hanging" font-family="Inter, Roboto, system-ui, -apple-system, sans-serif" font-size="20" fill="#0f172a">③ 接收网络包｜从宿主机网卡进入 guest 网卡</text>
<rect x="32" y="448" width="224" height="64" rx="20" fill="#eff6ff" stroke="#475569" stroke-width="1.5"/>
<text x="144" y="480" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#0f172a">宿主机 TAP</text>
<rect x="400" y="448" width="224" height="64" rx="20" fill="#eff6ff" stroke="#475569" stroke-width="1.5"/>
<text x="512" y="480" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#0f172a">VMM 网络设备线程</text>
<rect x="768" y="448" width="224" height="64" rx="20" fill="#eff6ff" stroke="#475569" stroke-width="1.5"/>
<text x="880" y="480" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#0f172a">guest 网卡队列</text>
<line x1="256" y1="128" x2="400" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#arrow-block)" style="color: #475569" fill="none"/>
<line x1="624" y1="128" x2="768" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#arrow-block)" style="color: #475569" fill="none"/>
<line x1="256" y1="304" x2="400" y2="304" stroke="#475569" stroke-width="2" marker-end="url(#arrow-block)" style="color: #475569" fill="none"/>
<line x1="624" y1="304" x2="768" y2="304" stroke="#475569" stroke-width="2" marker-end="url(#arrow-block)" style="color: #475569" fill="none"/>
<line x1="256" y1="480" x2="400" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arrow-block)" style="color: #475569" fill="none"/>
<line x1="624" y1="480" x2="768" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arrow-block)" style="color: #475569" fill="none"/>
<text x="328" y="110" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" fill="#64748B">提交请求</text>
<text x="696" y="110" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" fill="#64748B">唤醒处理</text>
<text x="328" y="286" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" fill="#64748B">CONNECT / ttrpc</text>
<text x="696" y="286" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" fill="#64748B">发送命令</text>
<text x="328" y="462" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" fill="#64748B">读取网络包</text>
<text x="696" y="462" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" fill="#64748B">填入共享队列</text>
</svg>
